<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>خريطة الانتشار الميداني | القطاع الميداني</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#070F2A; --deep:#0C1840; --panel:rgba(12,24,64,.86); --line:#22346F;
  --gold:#E9B949; --gold-soft:rgba(233,185,73,.18); --nile:#3FC1B5;
  --text:#E9EDF8; --muted:#93A0C8; --alert:#F0656B; --ok:#62C98A;
  --display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --panel-w:420px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--ink);color:var(--text);font-family:var(--body);overflow:hidden;font-size:15px;line-height:1.6}
button,input{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---------- layout ---------- */
#app{position:relative;height:100%;display:grid;grid-template-rows:auto 1fr auto}
header{display:flex;align-items:center;gap:20px;padding:14px 22px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(12,24,64,.9),rgba(7,15,42,.6));z-index:5;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.15}
.brand h1{margin:0;font-family:var(--display);font-size:26px;font-weight:700;color:var(--text);letter-spacing:0}
.brand span{font-size:13px;color:var(--muted)}
.signal{width:38px;height:38px;flex:none;position:relative}
.signal i{position:absolute;inset:0;border:2px solid var(--gold);border-radius:50%;opacity:0}
.signal b{position:absolute;inset:14px;background:var(--gold);border-radius:50%}
.anim .signal i{animation:ping 2.4s cubic-bezier(.2,.6,.3,1) infinite}
.anim .signal i:nth-child(2){animation-delay:.8s}.anim .signal i:nth-child(3){animation-delay:1.6s}
@keyframes ping{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1.25);opacity:0}}

.tools{margin-inline-start:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{position:relative}
.search input{width:260px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:999px;padding:8px 16px;outline:none}
.search input:focus{border-color:var(--gold)}
.results{position:absolute;top:calc(100% + 6px);inset-inline-start:0;width:340px;max-height:60vh;overflow:auto;background:var(--deep);border:1px solid var(--line);border-radius:12px;display:none;z-index:30;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.results.on{display:block}
.results button{display:block;width:100%;text-align:start;background:none;border:0;border-bottom:1px solid rgba(255,255,255,.05);padding:9px 14px;cursor:pointer}
.results button:hover,.results button:focus-visible{background:var(--gold-soft)}
.results small{display:block;color:var(--muted);font-size:12px}
.btn{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:999px;padding:7px 15px;cursor:pointer;white-space:nowrap;transition:border-color .2s,background .2s}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--gold);color:#1B1403;border-color:var(--gold);font-weight:600}
.btn.on{background:var(--gold-soft);border-color:var(--gold)}

main{position:relative;overflow:hidden}
#map{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#map:active{cursor:grabbing}

/* ---------- map styling ---------- */
.grat{fill:none;stroke:rgba(147,160,200,.07);stroke-width:1;vector-effect:non-scaling-stroke}
.gov{fill:rgba(20,36,90,.75);stroke:rgba(147,160,200,.45);stroke-width:1;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .35s,opacity .35s}
.gov:hover{fill:rgba(233,185,73,.22)}
.gov.sel{stroke:var(--gold);stroke-width:3;opacity:1}
.gov.dim{opacity:.28}
.gov:focus{outline:none}.gov:focus-visible{stroke:var(--gold);stroke-width:2.5}
.region-edge{fill:none;stroke-width:2.2;vector-effect:non-scaling-stroke;pointer-events:none;opacity:.85}
.arc{fill:none;stroke:var(--nile);stroke-width:1.1;vector-effect:non-scaling-stroke;opacity:.55;stroke-dasharray:3 7;pointer-events:none}
.anim .arc{animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
.node{fill:var(--nile);stroke:var(--ink);vector-effect:non-scaling-stroke;pointer-events:none}
.lbl{fill:var(--text);font-family:var(--body);font-weight:500;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:rgba(7,15,42,.85);stroke-linejoin:round}
.lbl.small{fill:var(--muted)}
.hq-core{fill:var(--gold);cursor:pointer}
#gHQ:focus{outline:none}#gHQ:focus-visible .hq-core{stroke:#fff;stroke-width:2;vector-effect:non-scaling-stroke}
.hq-ring{fill:none;stroke:var(--gold);vector-effect:non-scaling-stroke}
.hq-label{fill:var(--gold);font-family:var(--display);font-weight:700;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:var(--ink)}
.radar-ring{fill:none;stroke:rgba(233,185,73,.16);stroke-width:1;vector-effect:non-scaling-stroke;pointer-events:none}
.pulse{fill:none;stroke:var(--gold);vector-effect:non-scaling-stroke;pointer-events:none}

/* ---------- region chips ---------- */
.chips{position:absolute;bottom:16px;inset-inline-end:16px;display:flex;flex-wrap:wrap;gap:6px;max-width:min(560px,calc(100% - 32px));z-index:4}
.chip{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px;backdrop-filter:blur(6px)}
.chip i{width:10px;height:10px;border-radius:50%;flex:none}
.chip:hover,.chip.on{border-color:var(--gold)}
.mapctl{position:absolute;top:16px;inset-inline-end:16px;display:flex;flex-direction:column;gap:6px;z-index:4}
.mapctl button{width:40px;height:40px;border-radius:12px;background:var(--panel);border:1px solid var(--line);cursor:pointer;font-size:18px;backdrop-filter:blur(6px)}
.mapctl button:hover{border-color:var(--gold)}
.layers{position:absolute;top:16px;inset-inline-start:16px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;z-index:4;font-size:13px;backdrop-filter:blur(6px)}
.layers b{display:block;font-family:var(--display);font-weight:600;font-size:14px;margin-bottom:4px}
.layers label{display:flex;align-items:center;gap:8px;cursor:pointer;padding:2px 0}
.layers input{accent-color:var(--gold)}
.layers label.disabled{opacity:.45;cursor:not-allowed}

/* ---------- panel ---------- */
#panel{position:absolute;top:0;bottom:0;inset-inline-start:0;width:var(--panel-w);max-width:100%;background:var(--panel);border-inline-end:1px solid var(--line);backdrop-filter:blur(12px);transform:translateX(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1);z-index:6;display:flex;flex-direction:column}
#panel.open{transform:none}
.p-head{padding:20px 22px 14px;border-bottom:1px solid var(--line);position:relative}
.p-head .kicker{font-size:13px;color:var(--muted)}
.p-head h2{margin:2px 0 0;font-family:var(--display);font-size:30px;font-weight:700;line-height:1.2}
.p-head .close{position:absolute;top:14px;inset-inline-end:14px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:none;cursor:pointer;font-size:16px}
.p-body{overflow:auto;padding:6px 22px 30px;flex:1}
.p-body h3{font-family:var(--display);font-weight:600;font-size:17px;margin:22px 0 8px;color:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.stat strong{display:block;font-family:var(--display);font-size:24px;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
.lead{border-inline-start:3px solid var(--gold);padding:6px 12px;margin:8px 0;background:rgba(233,185,73,.06);border-radius:0 8px 8px 0}
.lead small{display:block;color:var(--muted);font-size:12px}
.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.row .who{color:var(--muted);font-size:13px}
.status{font-size:12px;border-radius:999px;padding:1px 9px;white-space:nowrap;align-self:center}
.status.ok{background:rgba(98,201,138,.14);color:var(--ok)}
.status.miss{background:rgba(240,101,107,.14);color:var(--alert)}
.status.na{background:rgba(147,160,200,.12);color:var(--muted)}
details{border:1px solid var(--line);border-radius:10px;margin:6px 0;padding:0 12px}
details summary{cursor:pointer;padding:9px 0;font-weight:500;display:flex;justify-content:space-between;gap:10px}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";color:var(--gold)}
details[open] summary::after{content:"−"}
details ul{margin:0 0 10px;padding-inline-start:18px;color:var(--muted)}
.linkish{background:none;border:0;padding:0;color:var(--nile);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.note{font-size:13px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;margin-top:14px}
.people{list-style:none;padding:0;margin:4px 0}
.people li{padding:4px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.people li.hit{color:var(--gold)}

/* ---------- footer ticker ---------- */
footer{border-top:1px solid var(--line);background:rgba(7,15,42,.9);overflow:hidden;white-space:nowrap;font-size:13px;color:var(--muted);z-index:5}
.ticker{display:inline-flex;gap:48px;padding:8px 0;padding-inline-start:100%}
.anim .ticker{animation:tick 60s linear infinite}
.ticker b{color:var(--gold);font-family:var(--display);font-weight:600;margin-inline-end:6px}
@keyframes tick{to{transform:translateX(100%)}}

/* ---------- boot ---------- */
#boot{position:fixed;inset:0;background:var(--ink);z-index:50;display:grid;place-items:center;transition:opacity .8s}
#boot.gone{opacity:0;pointer-events:none}
.boot-box{width:min(460px,86vw)}
.boot-box h2{font-family:var(--display);font-size:34px;margin:0 0 18px;color:var(--gold);font-weight:700}
.boot-line{color:var(--muted);font-size:15px;opacity:0;transform:translateY(4px);transition:all .35s}
.boot-line.on{opacity:1;transform:none}
.boot-line.on::before{content:"◉ ";color:var(--nile)}
.bar{height:3px;background:var(--line);border-radius:3px;margin-top:20px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .4s}

#toast{position:fixed;bottom:60px;left:50%;transform:translate(-50%,20px);background:var(--deep);border:1px solid var(--gold);border-radius:12px;padding:10px 18px;opacity:0;transition:all .35s;z-index:40;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:760px){
  header{padding:10px 14px;gap:10px}
  .brand h1{font-size:20px}
  .search input{width:100%}
  .search{flex:1 1 100%}
  .tools{width:100%}
  .results{width:100%}
  #panel{top:auto;width:100%;height:62%;border-inline-end:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;transform:translateY(105%)}
  #panel.open{transform:none}
  .layers{display:none}
  .chips{bottom:10px;inset-inline-end:10px;max-width:calc(100% - 20px)}
  .chip{font-size:12px;padding:4px 10px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div id="boot" aria-hidden="true">
  <div class="boot-box">
    <h2>شبكة الرصد الميداني</h2>
    <div class="boot-line">تشغيل الغرفة المركزية بالقاهرة</div>
    <div class="boot-line">تفعيل الأقاليم الثمانية</div>
    <div class="boot-line">ربط 27 مكتبًا ميدانيًا بالمحافظات</div>
    <div class="boot-line">الخريطة جاهزة</div>
    <div class="bar"><i></i></div>
  </div>
</div>

<div id="app">
  <header>
    <div class="signal" aria-hidden="true"><i></i><i></i><i></i><b></b></div>
    <div class="brand">
      <h1>خريطة الانتشار الميداني</h1>
      <span>القطاع الميداني، مؤسسة حياة كريمة</span>
    </div>
    <div class="tools">
      <div class="search">
        <input id="q" type="search" placeholder="ابحث بالاسم أو الوظيفة أو المحافظة" aria-label="بحث" autocomplete="off">
        <div class="results" id="results" role="listbox"></div>
      </div>
      <button class="btn" id="tourBtn">جولة على الأقاليم</button>
      <button class="btn primary" id="importBtn">تحميل ملف الأعضاء</button>
      <input type="file" id="file" accept=".xlsx,.xls,.csv" hidden>
    </div>
  </header>

  <main>
    <svg id="map" viewBox="0 0 1000 900" preserveAspectRatio="xMidYMid meet" role="application" aria-label="خريطة جمهورية مصر العربية بالمحافظات">
      <defs>
        <radialGradient id="glow"><stop offset="0" stop-color="#E9B949" stop-opacity=".35"/><stop offset="1" stop-color="#E9B949" stop-opacity="0"/></radialGradient>
        <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E9B949" stop-opacity="0"/><stop offset="1" stop-color="#E9B949" stop-opacity=".32"/></linearGradient>
      </defs>
      <g id="world">
        <g id="gGrat"></g><g id="gGov"></g><g id="gEdges"></g><g id="gRadar"></g><g id="gArcs"></g><g id="gNodes"></g><g id="gPulse"></g><g id="gLbl"></g><g id="gHQ"></g>
      </g>
    </svg>

    <div class="layers" role="group" aria-label="طبقات الخريطة">
      <b>طبقات العرض</b>
      <label><input type="checkbox" id="lyArcs" checked> خطوط الربط بالمركزية</label>
      <label><input type="checkbox" id="lyRadar" checked> مسح الرصد</label>
      <label><input type="checkbox" id="lyRegions" checked> ألوان الأقاليم</label>
      <label class="disabled" id="lyDensityWrap"><input type="checkbox" id="lyDensity" disabled> كثافة الأعضاء</label>
    </div>

    <div class="mapctl">
      <button id="zin" aria-label="تكبير">+</button>
      <button id="zout" aria-label="تصغير">−</button>
      <button id="home" aria-label="العودة للمركزية" title="العودة للمركزية">⌂</button>
    </div>

    <div class="chips" id="chips"></div>

    <aside id="panel" aria-live="polite">
      <div class="p-head">
        <div class="kicker" id="pKicker"></div>
        <h2 id="pTitle"></h2>
        <button class="close" id="pClose" aria-label="إغلاق">✕</button>
      </div>
      <div class="p-body" id="pBody"></div>
    </aside>
  </main>

  <footer><div class="ticker" id="ticker"></div></footer>
</div>
<div id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

function arcPath(d){
  const [x1,y1]=hq,[x2,y2]=d.c, mx=(x1+x2)/2, my=(y1+y2)/2, dx=x2-x1, dy=y2-y1, len=Math.hypot(dx,dy)||1;

  return `M${x1},${y1} Q${mx-dy/len*off},${my+dx/len*off} ${x2},${y2}`;
}

function flyToBounds(b,maxK=12,dur=1100){
  const [[x0,y0],[x1,y1]]=b, dx=x1-x0, dy=y1-y0, cx=(x0+x1)/2, cy=(y0+y1)/2;
  const k=Math.max(1,Math.min(maxK,.72/Math.max(dx/VBW,dy/VBH)));
  const [ox,oy]=panelSide();
  const t=d3.zoomIdentity.translate(VBW/2+ox,VBH/2+oy).scale(k).translate(-cx,-cy);
  svg.transition().duration(reduceMotion?0:dur).ease(d3.easeCubicInOut).call(zoom.transform,t);
}
function panelSide(){
  const r=svg.node().getBoundingClientRect(), s=Math.min(r.width/VBW,r.height/VBH);
  if(innerWidth<=760) return [0,-(r.height*.62/2)/s*.9];
  const p=document.getElementById("panel").getBoundingClientRect();
  const pw=Math.min(420,r.width);
  // panel sits on the visual left (inline-start in RTL is right) -> detect side
  const panelOnRight = p.left > r.width/2;
  return [(panelOnRight?-1:1)*(pw/2)/s,0];
}

}
function stat(n,l){return `<div class="stat"><strong>${n}</strong><span>${l}</span></div>`}

function openGov(code){
  const d=byCode[code], r=d.region;
  highlight([code]);
  let html=`<div class="lead"><small>الإقليم</small><button class="linkish" data-region="${r.id}">${r.name}</button></div>`;
  html+=`<div class="lead"><small>مدير الإقليم</small>${esc(r.mgr)}</div><div class="lead"><small>منسق الإقليم</small>${esc(r.crd)}</div>`;
  if(ROSTER){
    const ppl=ROSTER.gov[code]||[];
    const byRole=groupRoles(ppl);
    html+=`<div class="stats">${stat(ppl.length,"عضو بالمكتب")}${stat((byRole["منسق ميداني"]||[]).length,"منسق ميداني")}${stat(Object.keys(byRole).length,"مسمى وظيفي")}</div>`;
    html+=`<h3>هيكل المكتب الميداني</h3>`;
    OFFICE_ROLES.forEach(role=>{
      const list=byRole[role]||[];
      const mandatory=role==="منسق عام المحافظة";
      html+=`<details ${list.length&&list.length<6?"open":""}><summary><span>${role}</span><span class="status ${list.length?"ok":(mandatory?"miss":"na")}">${list.length?list.length+" فرد":(mandatory?"غير مسجل — إلزامي":"غير مسجل")}</span></summary>${list.length?peopleList(list):""}</details>`;
    });
    const others=Object.keys(byRole).filter(k=>!OFFICE_ROLES.includes(k));
    if(others.length){
      html+=`<h3>مسميات أخرى بالمكتب</h3>`;
      others.forEach(k=>html+=`<details><summary><span>${esc(k)}</span><span class="status ok">${byRole[k].length}</span></summary>${peopleList(byRole[k])}</details>`);
    }
  } else {
    html+=`<h3>هيكل المكتب الميداني</h3>`;
    const st=(has)=>`<span class="status ${has?"ok":"miss"}">${has?"مسجل":"غير مسجل"}</span>`;
    html+=`<div class="row"><span>مدير مكتب <span class="who">(غير إلزامي)</span></span>${st(!BASE.noOfficeMgr.includes(code))}</div>`;
    html+=`<div class="row"><span>منسق عام المحافظة <span class="who">(إلزامي)</span></span>${st(true)}</div>`;
    html+=`<div class="row"><span>مسئول إداري المقر</span>${st(!BASE.noAdmin.includes(code))}</div>`;
    html+=`<div class="row"><span>باحث اجتماعي</span>${st(!BASE.noResearcher.includes(code))}</div>`;
    if(BASE.notes[code]) html+=`<p class="note">${esc(BASE.notes[code])}</p>`;
    const kp=BASE.people[code];
    if(kp){html+=`<h3>أعضاء معروفون</h3>`;kp.forEach(p=>html+=`<div class="lead"><small>${p.roles.map(esc).join("، ")}</small>${esc(p.name)}</div>`)}
    html+=`<p class="note">حالة التغطية من ملف بيانات أبريل 2026. لعرض كل أعضاء المكتب بالاسم والوظيفة، حمّل ملف الأعضاء من الزر أعلى الصفحة.</p>`;
  }
  setPanel(`مكتب ميداني`, "محافظة "+d.name, html);
  flyToBounds(path.bounds(d.f), code==="EG01"?16:10);
}

function openRegion(id){
  const r=REGIONS.find(x=>x.id===id);
  highlight(r.govs);
  document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c.dataset.id===id));
  let html=`<div class="lead"><small>مدير الإقليم</small>${esc(r.mgr)}</div><div class="lead"><small>منسق الإقليم</small>${esc(r.crd)}</div>`;
  const total = ROSTER? r.govs.reduce((s,g)=>s+(ROSTER.gov[g]||[]).length,0) : null;
  html+=`<div class="stats">${stat(r.govs.length,"محافظات")}${stat(total??"—","عضو بالمكاتب")}${stat(2,"قيادة إقليمية")}</div>`;
  html+=`<h3>المحافظات</h3>`;
  r.govs.forEach(g=>{
    const n=ROSTER?(ROSTER.gov[g]||[]).length:null;
    html+=`<div class="row"><button class="linkish" data-gov="${g}">${GOV_NAMES[g]}</button>${n!==null?`<span class="who">${n} عضو</span>`:""}</div>`;
  });
  html+=`<p class="note">قيادة الإقليم تعمل من الغرفة المركزية. <button class="linkish" data-central="1">عرض الغرفة المركزية</button></p>`;
  setPanel("إقليم", r.name, html);
  flyToBounds(boundsOf(r.govs), 8);
}

function openCentral(){
  clearHighlight(); hqPulse();
  const T=SECTOR.totals;
  const central = ROSTER?ROSTER.central:null;
  let html=`<div class="stats">${stat(central?central.length:T.central,"عضو بالمركزية")}${stat(T.departments,"إدارات")}${stat(T.regions*2,"قيادة إقليمية")}</div>`;
  html+=`<h3>القيادة</h3><div class="lead"><small>${SECTOR.director.role}</small>${esc(SECTOR.director.name)}</div>`;
  html+=`<div class="lead"><small>${SECTOR.advisor.role} — ${SECTOR.advisor.note}</small>${esc(SECTOR.advisor.name)}</div>`;
  html+=`<h3>الإدارات الثمانية</h3>`;
  SECTOR.departments.forEach(d=>html+=`<details><summary><span>${d.name}</span></summary><ul><li>مدير الإدارة: ${d.head?esc(d.head):"—"}</li><li>مسئول وحدة متخصص + مسئول عام بالإدارة</li></ul></details>`);
  html+=`<h3>قيادات الأقاليم</h3>`;
  REGIONS.forEach(r=>html+=`<details><summary><span><i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${r.color};margin-inline-end:6px"></i>${r.name}</span></summary><ul><li>مدير الإقليم: ${esc(r.mgr)}</li><li>منسق الإقليم: ${esc(r.crd)}</li><li><button class="linkish" data-region="${r.id}">عرض الإقليم على الخريطة</button></li></ul></details>`);
  html+=`<h3>الوحدات</h3><ul class="people">${SECTOR.units.map(u=>`<li>${u}</li>`).join("")}</ul>`;
  html+=`<h3>ملف الخدمات الصحية</h3>`;
  SECTOR.files.forEach(f=>html+=`<div class="row"><span>${f.role}</span><span class="who">${f.count}</span></div>`);
  html+=`<h3>وظائف الدعم والتخصص</h3>`;
  SECTOR.support.forEach(s=>html+=`<div class="row"><span>${s.role}</span><span class="who">${s.name?esc(s.name):s.count}</span></div>`);
  if(central){
    html+=`<h3>كل أعضاء الغرفة المركزية (${central.length})</h3>`;
    const g=groupRoles(central);
    Object.keys(g).sort((a,b)=>rank(a)-rank(b)).forEach(k=>html+=`<details><summary><span>${esc(k)}</span><span class="status ok">${g[k].length}</span></summary>${peopleList(g[k])}</details>`);
  } else {
    html+=`<p class="note">لعرض كل أعضاء الغرفة المركزية بالاسم، حمّل ملف الأعضاء.</p>`;
  }
  setPanel("مقر القيادة، القاهرة","الغرفة المركزية",html);
  const s=70; flyToBounds([[hq[0]-s,hq[1]-s],[hq[0]+s,hq[1]+s]],6);
}
function rank(r){
  const order=["مدير القطاع","مستشار","مدير ادار","مدير إدار","مدير ملف","مدير إقليم","منسق إقليم","مسئول وحد","مسئول","أخصائي"];
  const i=order.findIndex(o=>r.startsWith(o)); return i<0?99:i;
}

/* ---------- roster import (local only) ---------- */
function N(s){return String(s??"").replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/ؤ/g,"و").replace(/ـ/g,"").replace(/\s+/g," ").trim()}
const GOV_KEY={};
Object.entries(GOV_NAMES).forEach(([c,n])=>GOV_KEY[N(n).replace(/\s/g,"")]=c);
Object.assign(GOV_KEY,{"الاقصر":"EG29","مدينهالاقصر":"EG29","بنيسويف":"EG22","بورسعيد":"EG03","الوادالجديد":"EG32","اسكندريه":"EG02","الاسكندريه":"EG02","القليوبيه":"EG14","الاسماعيليه":"EG19","المنوفيه":"EG17","الغربيه":"EG16","الدقهليه":"EG12","البحيره":"EG18","الشرقيه":"EG13","البحرالاحمر":"EG31"});
const CENTRAL_KEYS=["الغرفهالمركزيه","المؤسسه"];
function govCode(v){
  const k=N(v).replace(/^محافظه/,"").replace(/\s/g,"");
  if(CENTRAL_KEYS.includes(k)) return "C";
  return GOV_KEY[k]||null;
}
const CLASS_RX=/\(?\s*(ال)?برنامج\s*(ال)?رئاسي\s*\)?|\(?\s*(ضابط|ظابط)\s*\)?|\(?\s*خارج\s*البرنامج\s*\)?/g;
function canonRole(raw){
  const n=N(raw);
  if(!n) return null;
  if(n.includes("مدير القطاع الميداني")) return "مدير القطاع الميداني";
  if(/مدير\s*قطاع|مدير\s*(ال)?اقليم/.test(n)) return "مدير إقليم";
  if(/منسق\s*قطاع|منسق\s*(ال)?اقليم/.test(n)) return "منسق إقليم";
  if(n.includes("نائب منسق عام")) return "نائب منسق عام";
  if(n.includes("منسق عام")) return "منسق عام المحافظة";
  if(n.includes("منسق ميداني")) return "منسق ميداني";
  if(n.includes("مدير مكتب")) return "مدير مكتب";
  if(n.includes("مدير اداري")) return "مدير إداري المقر";
  if(/مس(ئ|ؤ)ول اداري/.test(n)) return "مسئول إداري المقر";
  if(n.includes("باحث اجتماعي")) return "باحث اجتماعي";
  const cleaned=String(raw).replace(CLASS_RX," ").replace(/[-–—]+\s*$/,"").replace(/\s+/g," ").trim();
  return cleaned||null;
}
function splitRoles(cell){
  return String(cell??"").split(/\n|\+|،/).map(canonRole).filter(Boolean);
}
function groupRoles(ppl){
  const g={}; ppl.forEach(p=>p.roles.forEach(r=>(g[r]=g[r]||[]).push(p))); 
  Object.values(g).forEach(a=>a.sort((x,y)=>x.name.localeCompare(y.name,"ar"))); return g;
}
function findCol(header,tests){
  for(const t of tests){const i=header.findIndex(h=>t.test(N(h)));if(i>=0)return i}
  return -1;
}
function parseRows(rows){
  const hi=rows.findIndex(r=>r.some(c=>/الاسم|اسم/.test(N(c))) && r.some(c=>/محافظ/.test(N(c))));
  if(hi<0) throw new Error("لم يتم العثور على صف العناوين (الاسم + محافظة العمل)");
  const H=rows[hi].map(c=>String(c??""));
  const iName=findCol(H,[/^الاسم/,/اسم/]);
  const iGov=findCol(H,[/محافظه العمل/,/مقر العمل/,/محافظ/]);
  const iRole=findCol(H,[/المس(ئ|ؤ)وليه/,/مس(ئ|ؤ)وليه/,/المسمي/,/الوظيفه/]);
  if(iName<0||iGov<0||iRole<0) throw new Error("لازم يكون في الملف أعمدة: الاسم، محافظة العمل، المسئولية");
  const out={gov:{},central:[],unmatched:[],total:0};
  rows.slice(hi+1).forEach(r=>{
    const name=String(r[iName]??"").replace(/\s+/g," ").trim(); if(!name) return;
    const p={name,roles:splitRoles(r[iRole])}; if(!p.roles.length) p.roles=["غير محدد"];
    const code=govCode(r[iGov]); out.total++;
    if(code==="C") out.central.push(p);
    else if(code) (out.gov[code]=out.gov[code]||[]).push(p);
    else out.unmatched.push(p);
  });
  return out;   /* لا يتم الاحتفاظ بأي عمود آخر (رقم قومي، تليفون، ...) */
}
const fileIn=document.getElementById("file");
document.getElementById("importBtn").onclick=()=>fileIn.click();
fileIn.onchange=async()=>{
  const f=fileIn.files[0]; if(!f) return;
  try{
    const wb=XLSX.read(await f.arrayBuffer(),{type:"array"});
    const sn=wb.SheetNames.find(n=>N(n).includes("الميداني"))||wb.SheetNames[0];
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:""});
    ROSTER=parseRows(rows);
    afterImport();
    toast(`تم تحميل ${ROSTER.total} عضو${ROSTER.unmatched.length?` — ${ROSTER.unmatched.length} بمقر عمل غير مطابق لمحافظة`:""}. البيانات معروضة على جهازك فقط.`);
  }catch(err){toast("تعذر قراءة الملف: "+err.message)}
  fileIn.value="";
};
function afterImport(){
  document.getElementById("lyDensityWrap").classList.remove("disabled");
  const dens=document.getElementById("lyDensity"); dens.disabled=false; dens.checked=true; applyFill();
  document.getElementById("importBtn").textContent="تحديث ملف الأعضاء";
  buildTicker(); buildIndex();
  openCentral();
}

/* ---------- fills ---------- */
function applyFill(){
  const dens=document.getElementById("lyDensity").checked&&ROSTER, reg=document.getElementById("lyRegions").checked;
  if(dens){
    const max=d3.max(feats,d=>(ROSTER.gov[d.code]||[]).length)||1;
    const sc=d3.scaleSequential([0,max],t=>d3.interpolateRgb("#14245A","#E9B949")(t));
    govSel.style("fill",d=>sc((ROSTER.gov[d.code]||[]).length));
  } else if(reg){
    govSel.style("fill",d=>d3.color(d.region.color).copy({opacity:.16}));
  } else govSel.style("fill",null);
  d3.select("#gEdges").style("display",reg?null:"none");
}
document.getElementById("lyRegions").onchange=applyFill;
document.getElementById("lyDensity").onchange=applyFill;
document.getElementById("lyArcs").onchange=e=>{d3.select("#gArcs").style("display",e.target.checked?null:"none");d3.select("#gNodes").style("display",e.target.checked?null:"none")};
document.getElementById("lyRadar").onchange=e=>d3.select("#gRadar").style("display",e.target.checked?null:"none");

/* ---------- search ---------- */
let INDEX=[];
function buildIndex(){
  INDEX=[];
  feats.forEach(d=>INDEX.push({t:"محافظة "+d.name,s:d.region.name,go:()=>openGov(d.code)}));
  REGIONS.forEach(r=>{
    INDEX.push({t:r.name,s:"إقليم",go:()=>openRegion(r.id)});
    INDEX.push({t:r.mgr,s:"مدير إقليم "+r.name,go:()=>openRegion(r.id)});
    INDEX.push({t:r.crd,s:"منسق إقليم "+r.name,go:()=>openRegion(r.id)});
  });
  INDEX.push({t:"الغرفة المركزية",s:"القاهرة",go:openCentral});
  INDEX.push({t:SECTOR.director.name,s:SECTOR.director.role,go:openCentral});
  INDEX.push({t:SECTOR.advisor.name,s:SECTOR.advisor.role,go:openCentral});
  SECTOR.departments.forEach(d=>{INDEX.push({t:d.name,s:"الغرفة المركزية",go:openCentral}); if(d.head) INDEX.push({t:d.head,s:"مدير "+d.name,go:openCentral})});
  SECTOR.support.filter(s=>s.name).forEach(s=>INDEX.push({t:s.name,s:s.role,go:openCentral}));
  Object.entries(BASE.people).forEach(([c,a])=>a.forEach(p=>INDEX.push({t:p.name,s:p.roles.join("، ")+" — "+GOV_NAMES[c],go:()=>openGov(c),name:p.name})));
  if(ROSTER){
    ROSTER.central.forEach(p=>INDEX.push({t:p.name,s:p.roles.join("، ")+" — الغرفة المركزية",go:openCentral,name:p.name}));
    Object.entries(ROSTER.gov).forEach(([c,a])=>a.forEach(p=>INDEX.push({t:p.name,s:p.roles.join("، ")+" — "+GOV_NAMES[c],go:()=>openGov(c),name:p.name})));
  }
  const seen=new Set(); INDEX=INDEX.filter(x=>{const k=x.t+"|"+x.s;if(seen.has(k))return false;seen.add(k);return true});
}
const q=document.getElementById("q"), res=document.getElementById("results");
function hideResults(){res.classList.remove("on")}
q.addEventListener("input",()=>{
  const v=N(q.value); if(v.length<2){hideResults();return}
  const hits=INDEX.filter(x=>N(x.t).includes(v)||N(x.s).includes(v)).slice(0,30);
  res.innerHTML=hits.length?hits.map((h,i)=>`<button data-i="${i}">${esc(h.t)}<small>${esc(h.s)}</small></button>`).join(""):`<button disabled>لا توجد نتائج<small>جرّب جزءًا من الاسم أو المسمى</small></button>`;
  res.classList.add("on");
  res.querySelectorAll("button[data-i]").forEach(b=>b.onclick=()=>{const h=hits[+b.dataset.i];hitName=h.name||null;h.go();hideResults();q.blur();setTimeout(()=>hitName=null,100)});
});
q.addEventListener("keydown",e=>{if(e.key==="Enter"){const b=res.querySelector("button[data-i]");if(b)b.click()}});
document.addEventListener("click",e=>{if(!e.target.closest(".search"))hideResults()});

/* ---------- tour ---------- */
let tourTimer=null;
const tourBtn=document.getElementById("tourBtn");
tourBtn.onclick=()=>{
  if(tourTimer){stopTour();return}
  tourBtn.textContent="إيقاف الجولة"; tourBtn.classList.add("on");
  const steps=[()=>openCentral(),...REGIONS.map(r=>()=>openRegion(r.id)),()=>{closePanel();clearHighlight();home()}];
  let i=0; const next=()=>{steps[i](); i++; if(i<steps.length) tourTimer=setTimeout(next,5200); else stopTour();};
  next();
};
function stopTour(){clearTimeout(tourTimer);tourTimer=null;tourBtn.textContent="جولة على الأقاليم";tourBtn.classList.remove("on")}

/* ---------- ticker ---------- */
function buildTicker(){
  const T=SECTOR.totals;
  const total=ROSTER?ROSTER.total:T.members, central=ROSTER?ROSTER.central.length:T.central;
  const items=[[total,"عضو بالقطاع الميداني"],[T.governorates,"محافظة مغطاة"],[T.regions,"أقاليم"],[central,"عضو بالغرفة المركزية"],[T.departments,"إدارات مركزية"],[ROSTER?Object.values(ROSTER.gov).flat().filter(p=>p.roles.includes("منسق ميداني")).length:T.fieldCoord,"منسق ميداني"],[27,"منسق عام محافظة"]];
  const html=items.map(([n,l])=>`<span><b>${n}</b>${l}</span>`).join("");
  document.getElementById("ticker").innerHTML=html+html;
}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),5200)}

/* ---------- boot + intro animation ---------- */
buildIndex(); buildTicker(); applyFill();
function intro(){
  if(reduceMotion){hqPulse();return}
  const maxD=d3.max(feats,d=>Math.hypot(d.c[0]-hq[0],d.c[1]-hq[1]));
  govSel.each(function(d){
    const L=this.getTotalLength?this.getTotalLength():1000, delay=Math.hypot(d.c[0]-hq[0],d.c[1]-hq[1])/maxD*1400;
    d3.select(this).attr("stroke-dasharray",L).attr("stroke-dashoffset",L).style("fill-opacity",0)
      .transition().delay(delay).duration(1300).ease(d3.easeCubicOut).attr("stroke-dashoffset",0).style("fill-opacity",1)
      .on("end",function(){d3.select(this).attr("stroke-dasharray",null).attr("stroke-dashoffset",null)});
  });
  arcs.attr("opacity",0).transition().delay(d=>500+Math.hypot(d.c[0]-hq[0],d.c[1]-hq[1])/maxD*1500).duration(600).attr("opacity",.55);
  nodes.attr("opacity",0).transition().delay(d=>700+Math.hypot(d.c[0]-hq[0],d.c[1]-hq[1])/maxD*1500).duration(400).attr("opacity",1);
  d3.select("#gEdges").attr("opacity",0).transition().delay(1800).duration(900).attr("opacity",1);
  hqPulse();
}
(function boot(){
  const lines=[...document.querySelectorAll(".boot-line")], bar=document.querySelector(".bar i"), b=document.getElementById("boot");
  if(reduceMotion){b.remove();intro();return}
  lines.forEach((l,i)=>setTimeout(()=>{l.classList.add("on");bar.style.width=((i+1)/lines.length*100)+"%"},250+i*380));
  setTimeout(()=>{b.classList.add("gone");intro();setTimeout(()=>b.remove(),900)},250+lines.length*380+300);
})();
if(!reduceMotion){setInterval(pulse,700);setInterval(hqPulse,4200)}
</script>
